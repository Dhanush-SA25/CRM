# ── SmartCRM Netlify Configuration ─────────────────────────────────────
# Frontend build + deploy configuration for Netlify
# Connected to GitHub repo: https://github.com/Dhanush-SA25/CRM.git

[build]
  # The frontend lives in the frontend/ subdirectory
  base = "frontend/"
  command = "npm ci && npm run build"
  publish = "dist/"

[build.environment]
  # Node version (must match local development)
  NODE_VERSION = "20"
  # Set this to your deployed backend URL (e.g. Render) in Netlify dashboard
  # VITE_API_BASE_URL is read at build time by Vite
  # Example: https://smartcrm-api.onrender.com/api
  VITE_API_BASE_URL = ""

# ── SPA Redirect (fixes white-screen on refresh) ───────────────────────
# All routes fall back to index.html so React Router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── API Proxy (optional — alternative to VITE_API_BASE_URL) ───────────
# Uncomment and set your backend URL to proxy /api/* through Netlify
# This avoids CORS issues and keeps API calls same-origin
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# ── Security headers ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
